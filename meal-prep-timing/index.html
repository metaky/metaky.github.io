<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Prep &amp; Timing — Thanksgiving 2026</title>
<style>
  :root{
    --paper:#faf5ec; --card:#fffdf8; --ink:#3d3125; --muted:#8a7a63;
    --clay:#c96f4a; --sage:#7d8c6f; --line:#e7dcc8; --gold:#e9b44c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:Georgia,'Times New Roman',serif; background:var(--paper); color:var(--ink); padding:20px 14px 48px;}
  .wrap{max-width:560px; margin:0 auto;}
  h1{font-size:26px; font-weight:normal; text-align:center; margin-bottom:2px;}
  .sub{text-align:center; color:var(--muted); font-size:14px; margin-bottom:6px;}
  .now{text-align:center; font-size:15px; color:var(--clay); margin-bottom:18px; min-height:20px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(90,70,40,.06);}
  .row1{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .dish{font-size:19px;}
  .chip{font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .chip.wait{background:#efe9db; color:var(--muted);}
  .chip.going{background:#f6e3c8; color:#9a6212;}
  .chip.ready{background:#dde5d2; color:#4c603c;}
  .chip.done{background:#e3e3e3; color:#777;}
  .times{margin-top:6px; font-size:14.5px; color:var(--ink);}
  .times b{color:var(--clay); font-weight:normal;}
  .note{margin-top:3px; font-size:13.5px; color:var(--muted); font-style:italic;}
  .actions{margin-top:10px; display:flex; gap:8px;}
  button{font-family:inherit; font-size:13.5px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:9px; padding:6px 12px; cursor:pointer;}
  button.primary{background:var(--sage); border-color:var(--sage); color:#fff;}
  button:active{transform:scale(.97);}
  .empty{text-align:center; color:var(--muted); padding:28px 0; font-style:italic;}
  details.addbox{margin-top:20px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px;}
  summary{cursor:pointer; font-size:16px;}
  form{margin-top:12px; display:grid; gap:9px;}
  label{font-size:13px; color:var(--muted); display:grid; gap:3px;}
  input,textarea{font-family:inherit; font-size:15px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink);}
  .twocol{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .foot{margin-top:22px; text-align:center; font-size:12.5px; color:var(--muted); line-height:1.5;}
  .del{color:#b0563a; border-color:#e5c4b8;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍂 Meal Prep &amp; Timing</h1>
  <div class="sub">Thanksgiving — Thursday, Nov 26, 2026</div>
  <div class="now" id="now"></div>
  <div id="list"></div>

  <details class="addbox">
    <summary>＋ Add a dish</summary>
    <form id="addForm">
      <label>Dish name <input name="name" required placeholder="e.g. Turkey"></label>
      <div class="twocol">
        <label>Start time <input name="start" type="time" required></label>
        <label>Date <input name="date" type="date" required></label>
      </div>
      <div class="twocol">
        <label>Duration (minutes) <input name="durMin" type="number" min="1" required placeholder="60"></label>
        <label>Up to (optional, for ranges) <input name="durMax" type="number" min="1" placeholder="300"></label>
      </div>
      <label>Note <input name="note" placeholder="e.g. needs to rise, in the oven…"></label>
      <button class="primary" type="submit">Add to the board</button>
    </form>
  </details>

  <div class="foot">Shared board baked in for today. Anything you add here is saved<br>on this device only — it won't sync to other phones.</div>
</div>

<script>
const SEED = [
  {id:'seed-rolls', name:'Rolls', date:'2026-11-26', start:'09:30', durMin:180, durMax:300, note:'Set out at 9:30 to rise (3–5 hours)', done:false},
  {id:'seed-sweet', name:'Sweet potatoes', date:'2026-11-26', start:'09:45', durMin:60, durMax:60, note:'In the oven at 9:45 · about an hour (per Mel)', done:false},
  {id:'seed-bake', name:'Rolls — bake', date:'2026-11-26', start:'12:30', durMin:15, durMax:140, note:'Bake 15–20 min after they finish rising. Start slides with the rise (ends 12:30–2:30 PM), so baked by ~12:45–2:50 PM', done:false}
];
const KEY='mealprep-items-v1', DKEY='mealprep-done-v1';
function loadLocal(){ try{ return JSON.parse(localStorage.getItem(KEY))||[] }catch(e){ return [] } }
function loadDone(){ try{ return JSON.parse(localStorage.getItem(DKEY))||{} }catch(e){ return {} } }
function saveLocal(v){ localStorage.setItem(KEY, JSON.stringify(v)); }
function saveDone(v){ localStorage.setItem(DKEY, JSON.stringify(v)); }

function dt(item, mins){
  const d = new Date(item.date+'T'+item.start+':00');
  if(mins!=null) d.setMinutes(d.getMinutes()+mins);
  return d;
}
function fmt(d){ return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function fmtDur(m){
  if(m<60) return m+' min';
  const h=Math.floor(m/60), r=m%60;
  return r? h+' hr '+r+' min' : h+' hr';
}
function status(item, now){
  if(item.done) return ['done','Done'];
  const s=dt(item), e1=dt(item,item.durMin), e2=dt(item,item.durMax);
  if(now < s) return ['wait','Starts '+fmt(s)];
  if(now < e1) return ['going','Going · ready '+fmt(e1)+(item.durMax>item.durMin?'–'+fmt(e2):'')];
  if(now <= e2) return ['ready','In the ready window'];
  return ['ready','Ready since '+fmt(e2)];
}
function render(){
  const now=new Date();
  document.getElementById('now').textContent =
    'It\u2019s '+ now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) +' now';
  const doneMap=loadDone();
  const items=[...SEED.map(s=>({...s, done: !!doneMap[s.id]})), ...loadLocal()]
    .sort((a,b)=> dt(a)-dt(b) || a.name.localeCompare(b.name));
  const list=document.getElementById('list');
  if(!items.length){ list.innerHTML='<div class="empty">Nothing on the board yet.</div>'; return; }
  list.innerHTML=items.map(it=>{
    const [cls,label]=status(it,now);
    const readyTxt = it.durMax>it.durMin
      ? fmt(dt(it,it.durMin))+' – '+fmt(dt(it,it.durMax))
      : '~'+fmt(dt(it,it.durMin));
    const local = !it.id.startsWith('seed-');
    return `<div class="card">
      <div class="row1"><div class="dish">${esc(it.name)}</div><div class="chip ${cls}">${label}</div></div>
      <div class="times">Start <b>${fmt(dt(it))}</b> · ${fmtDur(it.durMin)}${it.durMax>it.durMin?'–'+fmtDur(it.durMax):''} · Ready <b>${readyTxt}</b></div>
      ${it.note?`<div class="note">${esc(it.note)}</div>`:''}
      <div class="actions">
        <button onclick="toggleDone('${it.id}')">${it.done?'↩ Not done':'✓ Mark done'}</button>
        ${local?`<button class="del" onclick="removeItem('${it.id}')">Remove</button>`:''}
      </div>
    </div>`;
  }).join('');
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toggleDone(id){
  if(id.startsWith('seed-')){
    const d=loadDone(); d[id]=!d[id]; saveDone(d);
  } else {
    const items=loadLocal(); const it=items.find(x=>x.id===id);
    if(it){ it.done=!it.done; saveLocal(items); }
  }
  render();
}
function removeItem(id){
  saveLocal(loadLocal().filter(x=>x.id!==id)); render();
}
document.getElementById('addForm').addEventListener('submit', e=>{
  e.preventDefault();
  const f=new FormData(e.target);
  const durMin=parseInt(f.get('durMin'),10);
  const durMaxRaw=parseInt(f.get('durMax'),10);
  const items=loadLocal();
  items.push({
    id:'local-'+Date.now(),
    name:f.get('name').trim(), date:f.get('date'), start:f.get('start'),
    durMin:durMin, durMax: isNaN(durMaxRaw)||durMaxRaw<durMin ? durMin : durMaxRaw,
    note:f.get('note').trim(), done:false
  });
  saveLocal(items); e.target.reset(); render();
});
document.querySelector('input[name="date"]').value='2026-11-26';
render();
setInterval(render, 30000);
</script>
</body>
</html>
